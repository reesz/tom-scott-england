name: Sync episodes from tomscott.com

# Run from the Actions tab ("Run workflow"). Pulls new episodes and route stops
# from tomscott.com/england, commits the data changes to main and redeploys.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would change (no commit, no deploy)
        type: boolean
        default: false

permissions:
  contents: write # commit the updated data
  actions: write # start the Pages deploy

concurrency:
  group: sync-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync data
        shell: bash # -o pipefail, so a failing script fails the step despite tee
        run: |
          python3 scripts/sync-episodes.py ${{ inputs.dry_run && '--dry-run' || '' }} | tee sync-output.txt
          {
            echo '### Episode sync'
            echo '```'
            cat sync-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/counties.json public/data/journey.json
          {
            echo 'data: sync episodes from tomscott.com/england'
            echo
            sed 's/^/    /' sync-output.txt
          } > commit-message.txt
          git commit -F commit-message.txt
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the Pages deploy explicitly
      - name: Deploy
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
